<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Games Collection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 50px;
            text-align: center;
        }

        h1 {
            font-size: 3em;
            color: #667eea;
            margin-bottom: 20px;
        }

        .subtitle {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 40px;
        }

        .games-grid {
            display: grid;
            gap: 20px;
            margin-top: 40px;
        }

        .game-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            border-radius: 15px;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            display: block;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .game-icon {
            font-size: 4em;
            margin-bottom: 15px;
        }

        .game-title {
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .game-description {
            font-size: 1em;
            opacity: 0.9;
        }

        .footer {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #eee;
            color: #999;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Retro Games Collection</h1>
        <p class="subtitle">Choose a game to play</p>

        <div class="games-grid">
            <a href="rps15.html" class="game-card">
                <div class="game-icon">🎮</div>
                <div class="game-title">RPS-15</div>
                <div class="game-description">
                    Rock Paper Scissors - 15 Gestures Edition<br>
                    Test your luck against the computer with 15 unique gestures!
                </div>
            </a>
        </div>

        <div class="footer">
            Click on a game card to start playing!
        </div>
    </div>
</body>
</html>
